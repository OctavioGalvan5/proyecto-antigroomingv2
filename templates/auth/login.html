{% extends "base.html" %}
{% block title %}Iniciar sesión — Antigrooming{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 44px; height: 44px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Ingresar al panel</h1>
      <p style="color: var(--slate-500); font-size: 0.9rem; margin: 0;">Iniciá sesión como padre o tutor responsable</p>
    </div>

    <form method="post" class="form" style="max-width: 100%; margin: 0;">
      <label>
        <span>Correo electrónico</span>
        <input type="email" name="email" required value="{{ email or '' }}" autocomplete="email" placeholder="tu@email.com">
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button type="submit" style="width: 100%; margin-top: 0.5rem;">Ingresar</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--slate-100); font-size: 0.9rem; color: var(--slate-600);">
      ¿No tenés una cuenta? <a href="{{ url_for('auth.signup') }}" style="color: var(--primary-600); font-weight: 600; text-decoration: none;">Crear cuenta gratis</a>
    </div>
  </div>
</div>
{% endblock %}
