{% extends "base.html" %}
{% block title %}Ingresar — Antigrooming{% endblock %}
{% block content %}
<h1>Ingresar</h1>

<form method="post" class="form">
  <label>
    <span>Email</span>
    <input type="email" name="email" required value="{{ email or '' }}" autocomplete="email">
  </label>
  <label>
    <span>Contraseña</span>
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">Ingresar</button>
</form>

<p>¿No tenés cuenta? <a href="{{ url_for('auth.signup') }}">Crear una</a>.</p>
{% endblock %}
